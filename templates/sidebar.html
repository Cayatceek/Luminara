 
 {% load static %}
 <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
 <link rel="stylesheet" href="{% static 'css/styles.css' %}">
 <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
 <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
 <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
 <!-- Вертикальный сайдбар -->
  <!-- Кнопка для переключения сайдбара -->
  <button class="sidebar-toggle btn btn-dark position-fixed top-0 start-0 m-3" type="button" aria-label="Toggle sidebar">
    <i class="bi bi-list"></i>
</button>
 <nav class="sidebar navbar-dark bg-dark d-flex flex-column p-3" id="sidebar">
    <a class="navbar-brand mb-3" href="/">Luminara</a>
    <ul class="nav flex-column">
        <li class="nav-item">
            <a class="nav-link text-white" href="{% url 'home' %}"><i class="bi bi-house me-2"></i>Home</a>
        </li>
        <li class="nav-item">
            <a class="nav-link text-white" href="{% url 'subjects' %}"><i class="bi bi-book me-2"></i>Lessons</a>
        </li>
        <li class="nav-item">
            <a class="nav-link text-white" href="{% url 'progress_page' %}"><i class="bi bi-graph-up me-2"></i>Progress</a>
        </li>
        {% if user.is_authenticated %}
            <li class="nav-item">
                <a class="nav-link text-white" href="#" data-bs-toggle="modal" data-bs-target="#logoutModal"><i class="bi bi-box-arrow-right me-2"></i>Выйти</a>
            </li>
        {% else %}
            <li class="nav-item">
                <a class="nav-link text-white" href="#" data-bs-toggle="modal" data-bs-target="#loginModal"><i class="bi bi-box-arrow-in-right me-2"></i>Войти</a>
            </li>
        {% endif %}
    </ul>
</nav>
