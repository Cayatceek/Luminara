<!DOCTYPE html>
<html lang="ru">
<head>
    {% load static %}
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Luminara{% endblock %}</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'css/styles.css' %}">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</head>
<body>
    <div class="container py-4">
        <h1 class="mb-4 fade-in">Categories</h1>

        <!-- Кнопка "Назад" к предметам -->
        <div class="mb-3">
            <a href="{% url 'subjects' %}" class="btn btn-outline-secondary btn-sm">
                <i class="bi bi-arrow-left"></i> Back to Subjects
            </a>
        </div>

        {% if not user.is_authenticated %}
            <div class="alert alert-warning fade-in">
                <p>Please <a href="#" data-bs-toggle="modal" data-bs-target="#loginModal">log in</a> to access categories.</p>
            </div>
        {% endif %}

        <!-- Список категорий -->
        <div id="category-list" class="mb-4 fade-in"></div>
    </div>
    <script src="{% static 'js/categories.js' %}" defer></script>
</body>
