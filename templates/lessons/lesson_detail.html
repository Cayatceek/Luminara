<!DOCTYPE html>
<html lang="ru">
<head>
    {% load static %}
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Luminara{% endblock %}</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'css/styles.css' %}">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</head>
<body>
    
    <div class="container py-4">
        <div id="lesson-content" data-lesson-id="{{ lesson_id }}">
            <div class="card shadow-sm mb-4 fade-in">
                <div class="card-body">
                    <div class="d-flex justify-content-between align-items-center mb-3">
                        <h3 id="lesson-title" class="card-title mb-0"></h3>
                        <a href="{% url 'lessons' subject_id=subject_id category_id=category_id %}" class="btn btn-outline-secondary btn-sm">
                            <i class="bi bi-arrow-left"></i> Back to Lessons
                        </a>
                    </div>
                    <p id="lesson-text" class="card-text"></p>
                </div>
            </div>
            <div class="card shadow-sm fade-in">
                <div class="card-body">
                    <h4 class="mb-3">Practice</h4>
                    <!-- Прогресс-бар -->
                    <div class="mb-3">
                        <div class="progress" style="height: 8px;">
                            <div id="lesson-progress" class="progress-bar bg-success" role="progressbar" style="width: 0%;" aria-valuenow="0" aria-valuemin="0" aria-valuemax="100"></div>
                        </div>
                        <small class="text-muted">Progress: <span id="progress-text">0%</span></small>
                    </div>
                    <form id="answer-form">
                        {% csrf_token %}
                        <div class="mb-3">
                            <label for="question" class="form-label d-flex align-items-center">
                                <i class="bi bi-question-circle me-2"></i> Question:
                            </label>
                            <select id="question" class="form-select" name="question_key"></select>
                        </div>
                        <div class="mb-3">
                            <label for="answer" class="form-label d-flex align-items-center">
                                <i class="bi bi-pen me-2"></i> Your Answer:
                            </label>
                            <input type="text" id="answer" class="form-control" required>
                        </div>
                        <button type="submit" class="btn btn-primary">
                            <i class="bi bi-check-circle me-2"></i> Submit
                        </button>
                    </form>
                    <div id="feedback" class="mt-3 alert fade-in" style="display: none;"></div>
                </div>
            </div>
        </div>
    </div>
    <script src="{% static 'js/lesson_detail.js' %}" defer></script>
</body>
