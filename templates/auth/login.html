<div class="modal fade" id="loginModal" tabindex="-1" aria-labelledby="loginModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="loginModalLabel">Вход</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body">
                <form method="post" action="{% url 'account_login' %}" class="auth-form">
                    {% csrf_token %}
                    <div class="mb-3 position-relative">
                        <label for="{{ form.email.id_for_label }}" class="form-label">Электронный адрес</label>
                        <input type="email" class="form-control" id="{{ form.email.id_for_label }}" name="{{ form.email.html_name }}"
                               placeholder="name@email.com" value="{{ form.email.value|default_if_none:'' }}" required>
                        {{ form.email.errors }}
                    </div>
                    <div class="mb-3 position-relative">
                        <label for="{{ form.password.id_for_label }}" class="form-label">Пароль</label>
                        <input type="password" class="form-control" id="{{ form.password.id_for_label }}" name="{{ form.password.html_name }}"
                               placeholder="Введите пароль" required>
                        <span class="password-toggle position-absolute end-0 top-50 translate-middle-y me-3" onclick="togglePassword('{{ form.password.id_for_label }}')">
                            <i class="bi bi-eye"></i>
                        </span>
                        {{ form.password.errors }}
                    </div>
                    <button type="submit" class="btn btn-primary w-100">Войти</button>
                </form>
                <div class="auth-social-login mt-3">
                    <button type="button" class="btn btn-outline-secondary w-100 mb-2 social-btn google-btn"><i class="bi bi-google"></i> Продолжить с Google</button>
                    <button type="button" class="btn btn-outline-secondary w-100 mb-2 social-btn facebook-btn"><i class="bi bi-facebook"></i> Продолжить с Facebook</button>
                    <button type="button" class="btn btn-outline-secondary w-100 mb-2 social-btn apple-btn"><i class="bi bi-apple"></i> Продолжить через Apple</button>
                </div>
                <div class="auth-link text-center mt-3">
                    Первый раз на сайте? <a href="#" data-bs-toggle="modal" data-bs-target="#signupModal" onclick="closeLoginModal()">Зарегистрироваться</a>
                </div>
            </div>
        </div>
    </div>
</div>
{% load static %}
<script src="{% static 'js/auth/login.js' %}" defer></script>
